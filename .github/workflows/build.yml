name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lldb lld libssl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libpcre3-dev libffi-dev shared-mime-info unzip zip
          pip install --upgrade pip
          pip install buildozer cython pillow

      - name: Configure and Run Buildozer
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        run: |
          buildozer init
          # Rewrite file configurations automatically
          sed -i 's/^title =.*/title = YT Downloader/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = ytdownloader/' buildozer.spec
          sed -i 's/^source.include_exts =.*/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
          sed -i 's|^# source.filename =.*|source.filename = phone.py|' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy,pillow,yt-dlp/' buildozer.spec
          sed -i 's/^#android.permissions =.*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/^#android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          
          # Fix the AIDL block by pre-accepting licenses through the SDK tools pipeline
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Execute compile build
          buildozer -v android debug

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: AndroidApp
          path: bin/*.apk
